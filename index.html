<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planeraren</title>
<meta name="theme-color" content="#fbf3e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17132e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planeraren">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/src/gate.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Planeraren: the fridge family's calendar. Same chunky paper-note look as Kylskåpet, in three modes:
   Månad (a calendar page), Vecka (seven notes side by side) and Dag (one big note for the day).
   Family days (birthdays, jul, påsk, midsommar…) are drawn in automatically; anything else is a note you write. */
:root{
  --bg:#fbf3e4; --ink:#1d1740; --paper:#fffaf0; --muted:#6e6788; --line:#1d1740; --soft:#f3e6cf;
  --wkend:#fff0c2; --c1:#ff6b5b; --c2:#ffcb3d; --c3:#5ec8ff; --c4:#6fe3a1; --c5:#c58bff; --c6:#ff9ad5;
  --f-display:"Lilita One","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-body:"Nunito","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#17132e;--ink:#fff7e8;--paper:#2a2350;--muted:#a9a2c7;--line:#0d0a1f;--soft:#201a40;--wkend:#3b2f66;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#17132e;--ink:#fff7e8;--paper:#2a2350;--muted:#a9a2c7;--line:#0d0a1f;--soft:#201a40;--wkend:#3b2f66;color-scheme:dark}

*{box-sizing:border-box}
html{height:100%}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-weight:800;margin:0;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1.2px,transparent 1.3px);background-size:22px 22px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:4px solid var(--c3);outline-offset:3px;border-radius:14px}
.wrap{max-width:1360px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;min-height:0}
.appin{display:contents}
/* the fridge, shown as a page inside the page */
.fridge{flex:1;min-height:0;width:calc(100% + 32px);margin:0 -16px;border:0;background:transparent;display:block}
.fridge[hidden]{display:none}
.bnav,.fab,.dtools{display:none}
@media (max-width:760px){
  body{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:60;gap:6px;padding:6px;background:var(--paper);border:3px solid var(--line);border-radius:24px;box-shadow:4px 4px 0 var(--line);view-transition-name:bnav}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 6px;border-radius:17px;font-size:11px;font-weight:900;letter-spacing:.03em;transition:background .15s,transform .1s}
  .bnav button:active{transform:scale(.94)}
  .bnav svg{width:24px;height:24px}
  .bnav button[aria-current=page]{background:var(--ink);color:var(--paper)}
  .top .tabs{display:none}
  .act{width:100%;flex-wrap:wrap;justify-content:flex-start}
  .pill.back span{max-width:none}
  .pill.back .bt{display:none}
  .wrap{overflow-x:clip;overflow-clip-margin:16px}
  .top.kyl{display:none}
  .hint{display:none}
  /* Idag sits in the top right corner, on the same row as the month/week picker */
  .top .act{display:contents}
  .top .nav{order:1;flex:1 1 0;min-width:0}
  .top .act [data-act=today]{order:2}
  .top .act .brk{display:block;order:3;flex-basis:100%;height:0}
  .top .act>*{order:4}
}
.brk{display:none}
.top.kyl{margin-bottom:4px}
.disp{font-family:var(--f-display);font-weight:400;line-height:.92;letter-spacing:.005em;margin:0}
.muted{color:var(--muted)}

/* chunky pill buttons */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border:3px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font-weight:900;font-size:13px;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.pill:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--line)}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill.c2{background:var(--c2);color:#1d1740}
.pill.ico{width:40px;padding:0}
.pill svg{width:18px;height:18px}
.pill[aria-selected="true"]{background:var(--ink);color:var(--bg);transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* top bar: mode tabs on the left, date steering in the middle, actions on the right */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-bottom:12px;position:relative;z-index:30}
.tabs{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:3px 6px 9px;margin:-3px -6px -9px}
.tabs::-webkit-scrollbar{display:none}
.tabs .pill{flex:none}
.nav{display:flex;align-items:center;gap:8px}
.pill.back i{font-style:normal}
.wnote{min-width:0}.wnote .add{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html{overflow-x:clip}
.stage.gliding{overflow:visible}
.track{display:flex;flex:1;min-height:0;will-change:transform;align-items:stretch}
.track>.pane{flex:0 0 auto;display:flex;flex-direction:column;min-height:0}
.track>.pane>.view,.track>.view{flex:1;min-height:0}
.track .view,.track .view *{animation:none!important}
.week.strip{flex:0 0 auto}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.22,.9,.25,1)}
::view-transition-old(*),::view-transition-new(*){height:100%;width:100%;object-fit:none;object-position:left top;overflow:clip}
::view-transition-old(root),::view-transition-new(root){object-fit:fill}
::view-transition-old(*){animation:vtout .18s ease-out both}
::view-transition-new(*){animation:vtin .3s ease-out both}
@keyframes vtout{to{opacity:0}}@keyframes vtin{from{opacity:0}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.25s}
.pill.rollb.on{background:var(--ink);color:var(--paper)}
.nav h1{font-size:clamp(22px,2.6vw,34px);min-width:0;text-align:center;white-space:nowrap}
.nav h1 small{display:block;font-family:var(--f-body);font-weight:900;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px;line-height:1}
.act{display:flex;gap:8px;align-items:center}

/* the stage: whatever view is open fills the rest of the window */
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage input,.stage .tx{user-select:text;-webkit-user-select:text}
.stage.dragging{cursor:grabbing}
.view{flex:1;min-height:0;animation:slide .32s cubic-bezier(.3,1.4,.5,1) both}
@keyframes slide{from{opacity:0;transform:translateX(calc(var(--dir,0) * 80px)) rotate(calc(var(--dir,0) * .6deg))}to{opacity:1;transform:none}}

/* ---------- Månad: a calendar page ---------- */
.month{display:grid;grid-template-rows:auto 1fr;gap:6px;min-height:520px}
.month .wdh{display:grid;grid-template-columns:34px repeat(7,1fr);gap:6px}
.month .wdh span{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0 2px}
.month .grid{display:grid;grid-template-columns:34px repeat(7,1fr);grid-auto-rows:1fr;gap:6px;min-height:0}
.wk{display:grid;place-items:center;font-family:var(--f-display);font-size:15px;color:var(--muted);border-right:3px dashed color-mix(in srgb,var(--ink) 25%,transparent);margin-right:2px}
.wk b{display:block;font-weight:400}
button.wk{border-radius:10px;transition:color .15s,background .15s,transform .1s}button.wk:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}button.wk:active{transform:scale(.92)}
.wk small{font-size:8px;font-family:var(--f-body);font-weight:900;letter-spacing:.1em;display:block;text-align:center;margin-top:-2px}
.day{position:relative;display:flex;flex-direction:column;gap:3px;min-height:0;padding:6px 7px;border:3px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:4px 4px 0 var(--line);text-align:left;color:var(--ink);overflow:hidden;transition:transform .1s,box-shadow .1s;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 9ms)}
.day:hover{transform:translateY(-2px);box-shadow:5px 6px 0 var(--line)}
.day.out{opacity:.42;box-shadow:none;border-style:dashed;background:transparent;animation:none}
/* passerade dagar */
.day.past,.wnote.past,.hday.past{--hatch:color-mix(in srgb,var(--ink) 9%,transparent);background-image:repeating-linear-gradient(-45deg,var(--hatch) 0 2px,transparent 2px 9px)!important;box-shadow:none!important;filter:saturate(.25);opacity:.55}
.day.past:hover,.wnote.past:hover,.hday.past:hover{opacity:.9;filter:none}
.day.past .n,.wnote.past .hd .dn,.hday.past .hd .dn{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.day.past .dots,.day.past .hli{opacity:.6}
.day.wkend{background:var(--wkend)}
.day.out.wkend{background:transparent}
.day .n{font-family:var(--f-display);font-size:clamp(15px,1.6vw,22px);line-height:1;align-self:flex-start;position:relative;padding:2px 3px}
.day.today .n{color:#e8263a}
.day .items{display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden}
.chip{display:flex;align-items:center;gap:5px;font-size:clamp(9px,.9vw,12px);font-weight:900;line-height:1.1;padding:3px 7px;border:2px solid var(--line);border-radius:999px;background:var(--th,var(--c2));color:var(--thi,#1d1740);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
.chip svg{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chip.note{background:var(--paper);color:var(--ink);border-style:dashed;font-weight:800}
.chip.note.done{text-decoration:line-through;opacity:.55}
.chip.wkly{border:0;padding:0;background:transparent;color:var(--muted);font-size:10px;gap:3px}
.chip.more{background:transparent;border:0;padding:0 4px;color:var(--muted);font-size:10px}
.day .dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.day .dots i{width:7px;height:7px;border-radius:50%;background:var(--th);border:1.5px solid var(--line)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* hand-drawn ring around today, like a day circled on a paper calendar */
.ring{position:absolute;left:-30%;top:-26%;width:160%;height:152%;overflow:visible;pointer-events:none}
.ring path{fill:none;stroke:#e8263a;stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s .3s cubic-bezier(.5,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- Vecka: seven notes side by side ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(8px,1.2vw,16px);min-height:0;align-items:stretch}
.wnote{display:flex;flex-direction:column;gap:8px;min-height:0;padding:12px 10px 10px;border:4px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:6px 6px 0 var(--line);position:relative;transform:rotate(var(--r,0deg));animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 50ms)}
.wnote::before{content:"";position:absolute;left:50%;top:-13px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--mag,var(--c5));border:3px solid var(--line);box-shadow:2px 2px 0 var(--line)}
.wnote.wkend{background:var(--wkend)}
.wnote.today{background:var(--c3);color:#1d1740}

.wnote .hd{display:flex;align-items:baseline;justify-content:space-between;gap:6px;border-bottom:3px dashed color-mix(in srgb,currentColor 30%,transparent);padding-bottom:6px}
.wnote .hd .wd{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.wnote .hd .dn{font-family:var(--f-display);font-size:clamp(22px,2.4vw,34px);line-height:1;position:relative;padding:0 3px}
.wnote .list{display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto;scrollbar-width:thin;flex:1}
.wnote .add{margin-top:auto;align-self:stretch;min-height:32px;font-size:12px;box-shadow:0 3px 0 var(--line);border-width:2.5px;background:var(--paper);color:var(--ink)}
.ev{display:flex;align-items:center;gap:7px;padding:6px 9px;border:2.5px solid var(--line);border-radius:12px;background:var(--th,var(--c2));color:var(--thi,#1d1740);font-size:12.5px;font-weight:900;line-height:1.15;text-align:left;width:100%;box-shadow:2px 2px 0 var(--line)}
.ev svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ev .lft{margin-left:auto;font-size:10px;opacity:.75;white-space:nowrap}
.ev.wkly{background:var(--paper);color:var(--ink);border-style:dashed;box-shadow:none;font-weight:800}
/* a note you wrote: checkbox + text + time */
.td{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2px 8px;padding:5px 8px 5px 6px;border:2.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-size:12.5px;font-weight:800;line-height:1.2;text-align:left;width:100%;box-shadow:2px 2px 0 var(--line)}
.td .cb{width:20px;height:20px;border:2.5px solid var(--line);border-radius:7px;flex:none;display:grid;place-items:center;background:var(--paper);transition:transform .15s}
.td .cb svg{width:13px;height:13px;fill:none;stroke:#1d1740;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.td.done .cb{background:var(--c4);transform:rotate(-8deg)}
.td.done .cb svg{opacity:1}
.td.done .tx{text-decoration:line-through;opacity:.55}
.td .tx{min-width:0;overflow-wrap:break-word}
.td .tm{font-family:var(--f-display);font-size:12px;opacity:.7;white-space:nowrap;grid-column:2;line-height:1}
.td .x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;opacity:.45;flex:none}
.td .x:hover{opacity:1;background:var(--c1);color:#1d1740}
.td .x svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round}

/* ---------- Dag: one big note ---------- */
.dayv{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(14px,2vw,26px);min-height:0}
.poster{border:5px solid var(--line);border-radius:28px;box-shadow:12px 12px 0 var(--line);padding:clamp(18px,3vw,40px);background:var(--pc,var(--c3));color:#1d1740;display:flex;flex-direction:column;gap:14px;min-height:0;position:relative;overflow:hidden;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.poster .wd{font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.poster .big{font-size:clamp(84px,14vw,200px);line-height:.85;letter-spacing:-.02em;color:var(--paper);-webkit-text-stroke:4px var(--line);paint-order:stroke fill;text-shadow:8px 8px 0 var(--line);display:inline-block}
.poster .mo{font-size:clamp(26px,3.4vw,46px);margin-top:-4px}
.poster .evs{display:flex;flex-direction:column;gap:8px;margin-top:6px;overflow:auto;min-height:0;scrollbar-width:thin}
.poster .ev{font-size:15px;padding:10px 14px;border-width:3px;box-shadow:4px 4px 0 var(--line)}
.poster .ev svg{width:20px;height:20px}
.poster .empty{font-size:14px;opacity:.75;margin-top:4px}
.nxt{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border:3px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--line);transform:rotate(-1.2deg);text-align:left;width:fit-content;max-width:100%}
.nxt .big2{font-family:var(--f-display);font-size:34px;line-height:1}
.nxt .lb{font-size:12px;font-weight:900;line-height:1.2}
.nxt .lb small{display:block;font-weight:800;color:var(--muted);font-size:11px}
.sheet{display:flex;flex-direction:column;gap:10px;min-height:0;padding:clamp(14px,2vw,22px);border:4px solid var(--line);border-radius:22px;background:var(--paper);box-shadow:8px 8px 0 var(--line);position:relative;animation:pop .45s .08s cubic-bezier(.3,1.6,.5,1) both}
.sheet::before{content:"";position:absolute;left:50%;top:-14px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--c1);border:3px solid var(--line);box-shadow:2px 2px 0 var(--line)}
.sheet h2{font-size:clamp(20px,2.2vw,28px);display:flex;align-items:baseline;gap:10px}
.sheet h2 .cnt{font-family:var(--f-body);font-size:12px;font-weight:900;color:var(--muted)}
.sheet .list{display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:0;flex:1;scrollbar-width:thin;padding:2px}
.sheet .td{font-size:14px;padding:8px 10px 8px 8px}
.sheet .td{grid-template-columns:auto minmax(0,1fr) auto auto}
.sheet .td .tm{font-size:14px;grid-column:3}
.sheet .empty{font-size:14px;color:var(--muted);padding:10px 4px}
/* the day is one card: date on top/left, the day's things inside the same card */
.dayv.one{display:flex;min-height:0}
.daycard{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);background:var(--paper);border:5px solid var(--line);border-radius:28px;box-shadow:12px 12px 0 var(--line);overflow:hidden}
.dayv .daycard>.poster{border:0;border-right:5px solid var(--line);border-radius:0;box-shadow:none;min-height:0}
.dayv .daycard>.sheet{border:0;border-radius:0;box-shadow:none;background:transparent;padding:clamp(16px,2vw,26px)}
.dayv .daycard>.sheet::before{display:none}
.tl{position:relative;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.tl::before{content:"";position:absolute;left:53px;top:14px;bottom:14px;width:3px;border-radius:3px;background:color-mix(in srgb,var(--ink) 20%,transparent)}
.tlr,.tlnow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 20px;align-items:start;position:relative}
.tlt{font-family:var(--f-display);font-size:15px;line-height:1;text-align:right;padding-top:13px;color:var(--ink)}
.tlr::before{content:"";position:absolute;left:48px;top:13px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-sizing:border-box}
.tli{display:flex;flex-direction:column;gap:6px;min-width:0}
.tl .td .tm{display:none}
.tl.prop{display:block;flex:none;margin:10px 0 2px}
.tl.prop .td{padding-block:3px}
body:has(.stage.s-dag){height:100dvh;min-height:0;box-sizing:border-box}
.stage.s-dag>.view,.stage.s-dag .track,.stage.s-dag .pane>.view{flex:1;min-height:0}
.tl.prop::before{top:0;bottom:0}
.tl.prop .hr{position:absolute;left:62px;right:0;border-top:2px dashed color-mix(in srgb,var(--ink) 9%,transparent)}
.tl.prop .hr span{position:absolute;left:-62px;top:-8px;width:44px;text-align:right;font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.04em}
.tl.prop .dur{position:absolute;left:50px;width:9px;border-radius:5px;background:color-mix(in srgb,var(--c3) 65%,transparent);border:2px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.tlb{position:absolute;left:0;right:0;display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 20px;align-items:start;z-index:1}
.tlb::before{content:"";position:absolute;left:48px;top:13px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-sizing:border-box}
.tlb.nudged .tlt{opacity:.7}
.tlc{position:absolute;z-index:1;display:flex;min-width:0}
.tlc>.td,.tlc>.ev{height:100%;min-height:0;overflow:hidden;align-items:start;align-content:start;box-sizing:border-box}
.tl.prop .tlc>.td{padding:5px 8px 5px 7px;grid-template-rows:auto 1fr}
.tl.prop .tlc>.td .tm{display:block;grid-column:2;grid-row:2;font-size:11px;opacity:.6;align-self:start;margin-top:1px}
.tl.prop .tlc>.td .cb{grid-column:1;grid-row:1}
.tl.prop .tlc>.td .tx{grid-column:2;grid-row:1}
.tl.prop .tlc>.td .x{grid-row:1;grid-column:4}
.tlc.short .tx,.tlc.short>.ev>span:not(.lft){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){.tl.prop .tlc>.td,.tl.prop .tlc>.ev{font-size:14px;border-width:2.5px;border-radius:11px;box-shadow:2px 2px 0 var(--line);gap:2px 7px}.tl.prop .tlc>.td .cb{width:19px;height:19px}.tlc.side>.td .cb{display:none}.tlc.side>.td{grid-template-columns:minmax(0,1fr)}.tlc.side>.td .tx{grid-column:1}.tlc.side>.td .tm{grid-column:1}}
.tl.prop .tlc>.ev{flex-wrap:wrap;padding:6px 10px;row-gap:0}
.tl.prop .tlc>.ev>span:not(.lft){flex:1 1 60%}
.tl.prop .tlc>.ev .lft{display:inline;margin-left:0;font-size:11px;flex-basis:auto}
.tl.prop .tlc>.ev .lft:not(.end){margin-left:26px}
.tl.prop .tlc>.ev .lft.end{display:inline}
.tlc.short>.td .tm,.tlc.short>.ev .lft{display:none!important}
.tlc.short>.td,.tlc.short>.ev{padding-block:2px;align-items:center;align-content:center}
.tlc.side>.td .x{display:none}
.tlc.side>.td{grid-template-columns:auto minmax(0,1fr) 0 0}
.tld{position:absolute;left:48px;width:13px;height:13px;margin-top:-1px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-sizing:border-box;z-index:1}
.tlempty{position:absolute;left:62px;right:0;top:50%;transform:translateY(-50%);text-align:center;color:var(--muted);font-size:14px;margin:0;pointer-events:none}
.tl.prop .tlnow{position:absolute;left:0;right:0;transform:translateY(-50%);z-index:2;pointer-events:none}
.ev .lft.end{display:none}.tl .ev .lft{display:none}.tl .ev .lft.end{display:inline}
.tlnow{align-items:center}
.tlnow .tlt{padding:0;color:#e8263a;font-size:12px}
.tlnow i{height:3px;border-radius:3px;background:#e8263a;position:relative}
.tlnow i::before{content:"";position:absolute;left:-13px;top:-5px;width:13px;height:13px;border-radius:50%;background:#e8263a}
.sec{font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 -2px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:2px;background:color-mix(in srgb,var(--ink) 18%,transparent);border-radius:2px}
/* write a new note: time + text on one line */
.add-row{display:flex;gap:8px;align-items:stretch;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.add-row input{min-height:44px;border:3px solid var(--line);border-radius:14px;background:var(--bg);padding:0 12px;font-weight:800;min-width:0}
.add-row input[type=time]{width:112px;flex:none;font-family:var(--f-display);font-weight:400;font-size:16px}
.add-row input[type=text]{flex:1 1 150px}
.add-row .pill{min-height:44px}

/* a small sheet that pops up when you add from the week or month */
.ed{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--ink) 55%,transparent)}
.ed .box{width:min(440px,100%);background:var(--paper);border:4px solid var(--line);border-radius:22px;box-shadow:10px 10px 0 var(--line);padding:22px;display:grid;gap:12px;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.ed h3{font-size:24px}
.ed .add-row{margin:0;padding:0;flex-wrap:wrap}
.ed .add-row input[type=text]{flex:1 1 100%}
.ed .btns{display:flex;justify-content:flex-end;gap:8px}

.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* Google Calendar events */
.ev.gc{cursor:pointer}
.ev.gc.plan{background:var(--paper);color:var(--ink);box-shadow:none;font-weight:800}
.ev.gc.plan svg{opacity:.6}
.ev.gc .star{font-style:normal;font-size:13px;line-height:1;margin-left:2px;flex:none}
.ev.gc .lft+.star{margin-left:0}
.ev.gc span:not(.lft){overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev.gc.plan .lft{opacity:.7}
.chip.gplan{background:var(--paper);color:var(--ink);font-weight:800}
.chip .star{font-style:normal;flex:none}
.day .dots i.gp{background:transparent}
.gcb{position:relative}
.gcb.loading svg{animation:spin 1s linear infinite}
.gcb.err::after,.gcb.off::after{content:"";position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--c1);border:2.5px solid var(--line)}
.gcb.off::after{background:var(--c2)}
@keyframes spin{to{transform:rotate(360deg)}}
.ed .box.gs{max-height:calc(100dvh - 32px);overflow:auto}
.ed .lead{margin:0;font-size:13.5px;font-weight:700;line-height:1.4}
.ed .msg{margin:0;padding:10px 12px;border:2.5px solid var(--line);border-radius:12px;background:var(--c2);color:#1d1740;font-size:13px;font-weight:800;line-height:1.35}
.ed .msg.bad{background:var(--c1)}
.lvls{display:grid;gap:8px}
.lvl{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;align-items:center;text-align:left;padding:10px 12px;border:3px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--line);font-weight:900;font-size:14px}
.lvl small{grid-column:2;font-weight:700;font-size:12px;color:var(--muted)}
.lvl b{grid-row:span 2;font-size:20px;text-align:center}
.lvl[aria-pressed="true"]{background:var(--c4);color:#1d1740}
.lvl[aria-pressed="true"] small{color:#1d1740;opacity:.75}
.lvl.k[aria-pressed="true"]{background:var(--c2)}
.lvl.h[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.cals{display:grid;gap:6px}
.cal{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-weight:800;font-size:13px;text-align:left}
.cal i{width:18px;height:18px;border:2.5px solid var(--line);border-radius:6px;flex:none;display:grid;place-items:center;font-style:normal;font-size:12px}
.cal[aria-pressed="true"] i{background:var(--c4);color:#1d1740}
.cal[aria-pressed="false"]{opacity:.6}
.rules{margin:0;padding:0 0 0 18px;font-size:12.5px;font-weight:700;line-height:1.45;color:var(--muted)}
.rules b{color:var(--ink)}
.ed .btns{flex-wrap:wrap}
/* write to Google Kalender */
.dest{display:flex;gap:6px;flex-wrap:wrap}
.dest .pill{min-height:36px;font-size:12.5px;box-shadow:0 3px 0 var(--line)}
.dest .pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gopts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gopts[hidden]{display:none}
.gopts label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:900}
.gopts input[type=time],.gopts select{min-height:40px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:0 10px;font-weight:800;font-size:13px;max-width:100%}
.gopts select{flex:1 1 160px;min-width:0}
.gopts .chk input{width:20px;height:20px;accent-color:var(--c2)}
.add-row .gtog{width:44px;padding:0;flex:none}
.add-row .gtog[aria-pressed="true"]{background:var(--c3);color:#1d1740}
.ed .msg[hidden]{display:none}
/* Hämta & lämna */
.hs{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;padding:8px 10px;border:3px solid var(--line);border-radius:14px;background:var(--pc,var(--paper));color:#1d1740;box-shadow:3px 3px 0 var(--line);text-align:left;transition:transform .12s}
.hs:hover{transform:translateY(-2px) rotate(-.6deg)}
.hs small{font-size:10.5px;font-weight:900;letter-spacing:.02em;opacity:.8;margin-top:1px}
.hs b{font-family:var(--f-display);font-weight:400;font-size:clamp(18px,2vw,28px);line-height:1.05;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.hs.none{background:var(--paper);color:var(--muted);border-style:dashed;box-shadow:none}
.hlv{display:flex;flex-direction:column;gap:16px;min-height:0}
.hweek{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;flex:1;min-height:0}
.hday{display:flex;flex-direction:column;gap:10px;padding:12px 10px;border:4px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:6px 6px 0 var(--line);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 50ms)}
.hday .hs{flex:1;justify-content:center;min-height:70px}
.hday.today{background:var(--c3)}

.hday .hd{display:flex;align-items:baseline;justify-content:space-between;border-bottom:3px dashed color-mix(in srgb,var(--ink) 25%,transparent);padding-bottom:6px}
.hday.today .hd{color:#1d1740}
.hday .hd .wd{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.hday .hd .dn{font-family:var(--f-display);font-size:clamp(22px,2.4vw,34px);line-height:1;position:relative;padding:0 3px}
.hfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rulebox{gap:10px}
.rrow{display:grid;grid-template-columns:80px 1fr;align-items:center;gap:8px}
.rrow>b{font-weight:900;font-size:13px}
.rrow .pill[aria-pressed="true"]{background:var(--pc,var(--ink));color:#1d1740}
.rrow .pill[data-who="alt"][aria-pressed="true"]{background:var(--c2)}
.rrow.sub{grid-template-columns:1fr auto;font-size:12.5px;font-weight:700;padding-left:88px}
.chkrow{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:800}
.chkrow input,.drow input{width:20px;height:20px;accent-color:var(--c2);flex:none}
.rapply{border-top:3px dashed color-mix(in srgb,var(--ink) 25%,transparent);padding-top:10px;display:grid;gap:8px}
.rapply h4{margin:0;font-size:14px;font-weight:900}
.dlist{display:grid;gap:6px;max-height:40vh;overflow:auto}
.drow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:2.5px solid var(--line);border-radius:12px;font-size:13px;font-weight:700}
.drow small{color:var(--muted)}
.drow em{display:block;font-style:normal;font-size:11.5px;font-weight:900;color:var(--c1)}
.drow.bk{background:color-mix(in srgb,var(--c1) 12%,var(--paper))}
@media (max-width:760px){.rrow{grid-template-columns:1fr}.rrow.sub{padding-left:0}}
.tally{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:800}
.tp{padding:4px 10px;border:2.5px solid var(--line);border-radius:999px;background:var(--pc);color:#1d1740}
.rhythm{padding:12px 14px;border:3px dashed color-mix(in srgb,var(--ink) 35%,transparent);border-radius:18px}
.rhythm h3{font-size:18px;margin:0 0 8px}
.rgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rday{display:grid;gap:6px}
.rday .wd{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hs.mini{padding:5px 8px;border-width:2.5px;border-radius:11px;box-shadow:2px 2px 0 var(--line)}
.hs.mini b{font-size:15px}
.hs.mini small{font-size:9px}
.small{font-size:12px;margin:8px 0 0;font-weight:700}
.hlcard{max-width:520px;margin:6vh auto 0;padding:24px;border:4px solid var(--line);border-radius:22px;background:var(--paper);box-shadow:8px 8px 0 var(--line);display:grid;gap:12px;justify-items:start}
.hlcard .lead{margin:0;font-weight:700;line-height:1.45}
/* the strip on the week notes and the day poster */
.hlstrip{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hlstrip .hs{padding:4px 7px;border-width:2.5px;border-radius:11px;box-shadow:2px 2px 0 var(--line)}
.hlstrip .hs b{font-size:14px}
.hlstrip .hs small{font-size:8.5px}
.poster .hlstrip{max-width:420px;gap:10px}
.poster .hlstrip .hs{padding:8px 12px;border-width:3px}
.poster .hlstrip .hs b{font-size:22px}
.poster .hlstrip .hs small{font-size:10px}
.day .hli{position:absolute;top:5px;right:6px;display:flex;gap:2px}
.day .hli b{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);background:var(--pc);color:#1d1740;font-size:9px;font-weight:900;display:grid;place-items:center;line-height:1}
.day .hli b.no{background:transparent;border-style:dashed;color:var(--muted)}
.lvl .dotp{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);background:var(--pc);color:#1d1740;display:grid;place-items:center;font-size:14px}
.hlbox .add-row input[type=text]{flex:1 1 160px}
@media (max-width:760px){
  .hweek{grid-template-columns:1fr}
  .names span{display:none}
  .hname{font-size:16px;padding:6px 14px}
  .hs.inf small::after{content:""}
  .hday{display:grid;grid-template-columns:72px 1fr 1fr;align-items:stretch}
  .hday .hd{flex-direction:column;border-bottom:0;border-right:3px dashed color-mix(in srgb,var(--ink) 25%,transparent);padding:0 6px 0 0;justify-content:center}
  .hday .hs{min-height:54px}
  .rgrid{gap:5px}
  .hs.mini b{font-size:12px}
  .day .hli{top:3px;right:3px}
  .day .hli b{width:12px;height:12px;font-size:7px}
}
/* "as usual" (nothing written in the calendar): same colour, softer */
.hs.inf{border-style:dashed;box-shadow:none;background:color-mix(in srgb,var(--pc) 45%,#fffaf0);color:#1d1740}
.hs.inf small::after{content:" · som vanligt";text-transform:none;letter-spacing:0;font-weight:800}
.hs.mini.inf small::after,.wnote .hlstrip .hs.inf small::after{content:""}
.day .hli b.inf{border-style:dashed;background:color-mix(in srgb,var(--pc) 45%,#fffaf0)}
.dflt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:10px;font-size:12.5px;font-weight:800}
.dflt .pill{min-height:30px;padding:0 10px;font-size:12px;box-shadow:0 2px 0 var(--line)}
.dflt .pill[aria-pressed="true"]{background:var(--pc);color:#1d1740}
/* drag and drop */
[data-drag]{touch-action:pan-y}
.dragsrc{opacity:.35}
.ghost{position:fixed;z-index:90;pointer-events:none;transform:rotate(3deg) scale(1.05);box-shadow:8px 10px 0 color-mix(in srgb,var(--line) 70%,transparent)!important;opacity:.95;margin:0}
.dropok{outline:4px dashed var(--c1);outline-offset:3px}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
/* name tags to drag */
.names{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hname{padding:8px 16px;border:3px solid var(--line);border-radius:999px;background:var(--pc);color:#1d1740;font-family:var(--f-display);font-size:18px;letter-spacing:0;text-transform:none;box-shadow:0 4px 0 var(--line);cursor:grab;transform:rotate(-1.5deg);transition:transform .12s}
.hname:nth-child(odd){transform:rotate(1.5deg)}
.hname:hover{transform:translateY(-2px) rotate(-3deg)}
[data-dropslot].dropok{outline:4px dashed var(--c1);outline-offset:2px;transform:scale(1.03)}
.hs.saving{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.hs[data-drag]{cursor:grab}
/* a re-render with new data (not a new day or page) should not bounce everything again */
.appin.quiet *,.appin.quiet *::before,.appin.quiet *::after{animation:none!important}
/* click a day's head to open it, and a clear way back */
button.hd{width:100%;color:inherit;text-align:left;cursor:pointer;border-radius:8px}
button.hd:hover .dn{transform:scale(1.08) rotate(-3deg)}
.hd .dn{transition:transform .15s;display:inline-block}
button.nxt{cursor:pointer;font:inherit}
.pill.back{background:var(--c3);color:#1d1740}
.pill.back svg{width:16px;height:16px}
@media (max-width:760px){.pill.back span{max-width:110px;overflow:hidden;text-overflow:ellipsis}}
.poster .hlstrip .hs:not(.inf):not(.none) small::after,.hday .hs:not(.inf):not(.none) small::after{content:" · i kalendern";text-transform:none;letter-spacing:0;font-weight:800}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:95;max-width:min(520px,calc(100% - 32px));padding:12px 16px;border:3px solid var(--line);border-radius:16px;background:var(--c4);color:#1d1740;font-weight:800;font-size:13.5px;box-shadow:5px 5px 0 var(--line);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.toast.bad{background:var(--c1)}
/* day view: roomier, easier to read cards */
.sheet .list{gap:8px}
.sheet .ev{font-size:16px;padding:12px 14px;border-width:3px;border-radius:14px;box-shadow:3px 3px 0 var(--line);gap:10px;line-height:1.25}
.sheet .ev svg{width:20px;height:20px}
.sheet .ev .lft{font-size:14px;opacity:.85;font-weight:900}
.sheet .td{font-size:16px;padding:10px 12px 10px 10px;border-width:3px;border-radius:14px}
.sheet .td .tm{font-size:15px}
.sheet .td .cb{width:24px;height:24px}
.sheet .sec{font-size:12px;margin-top:10px}
.poster .ev .lft{font-size:13px}
/* phones: stack things, shorter header */
@media (max-width:760px){
  body{padding-block:10px calc(92px + env(safe-area-inset-bottom,0px))}
  .top{gap:8px}
  .tabs{order:1;width:100%}
  .nav{order:2;flex:1;justify-content:space-between}
  .nav h1{font-size:20px}
  .act{order:3}
  .act .txt{display:none}
  .act [data-act=new]{width:40px;padding:0}
  .month{min-height:0}
  .month .wdh,.month .grid{grid-template-columns:26px repeat(7,1fr);gap:4px}
  .month .grid{grid-auto-rows:minmax(58px,1fr)}
  .day{padding:4px 5px;border-width:2px;border-radius:10px;box-shadow:2px 2px 0 var(--line);gap:2px}
  body:has(.stage.s-manad){height:100dvh;min-height:0;box-sizing:border-box}
  body:has(.fridge:not([hidden])){height:100dvh;min-height:0;box-sizing:border-box;padding-bottom:0}
  body:has(.stage.s-dag){padding-bottom:0!important}
  .stage.s-manad{flex:1;min-height:0}
  .stage.s-manad .month{min-height:0;height:100%}
  .stage.s-manad>.view,.stage.s-manad .track,.stage.s-manad .pane>.view{flex:1}
  .month .grid{grid-auto-rows:minmax(40px,1fr)}
  .day .items{gap:2px}
  .day .items .chip{font-size:8.5px;padding:1px 3px;border-width:1.5px;gap:2px}
  .day .items .chip svg{display:none}
  .day .dots{margin-top:2px}
  .wk{font-size:12px}
  .week{grid-template-columns:1fr;grid-auto-rows:auto}
  .view,.stage{flex:none}
  .wnote{transform:none;min-height:0}
  .wnote .list{overflow:visible;flex:none}
  .wnote .hd .dn{font-size:26px}
  .dayv{grid-template-columns:1fr}
  .poster .big{font-size:96px}
  .sheet .list{overflow:visible}
  /* phone day view: a short date header, then the day itself gets the room */
  .dayv{gap:14px;grid-template-columns:minmax(0,1fr)}
  .daycard{display:flex;flex-direction:column;flex:1 1 auto;width:100%;min-height:0;border-width:4px;border-radius:22px;box-shadow:6px 6px 0 var(--line)}
  .dayv.one{flex-direction:column}
  body:has(.stage.s-dag){height:100dvh;min-height:0}
  body:has(.stage.s-dag) .top{display:none}
  body:has(.stage.s-dag) .hint{display:none}
  .dayv .dtools{grid-area:tools;display:flex;justify-content:space-between;align-items:center;margin:-2px -4px 10px}
  .dtools .pill.dt{min-height:38px;padding:0 14px 0 10px;gap:4px;font-size:14px;background:var(--paper);color:var(--ink);border-width:3px;box-shadow:3px 3px 0 var(--line)}
  .dtools .pill.dt svg{width:18px;height:18px}
  .dtools .pill.dt:only-child{margin-right:auto}
  .stage.s-dag{flex:1;min-height:0}
  .stage.s-dag>.view,.stage.s-dag .track,.stage.s-dag .pane>.view{flex:1;min-height:0}
  .dayv .poster>*{min-width:0}
